[package]
name = "codex-tokenlens"
version = "0.1.3"
description = "A lightweight desktop app for visualizing local Codex token usage."
authors = ["Codex TokenLens contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "codex_tokenlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
